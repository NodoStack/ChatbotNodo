<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Admin Nodobot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap + Icons + Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/panel_admin.css' %}?v=5">
    
    <link rel="icon" type="image/png" href="{% static 'img/chatbot.png' %}" />
</head>
<body>

<aside>
    <h5 class=" mb-4 text-center"><img src="{% static 'img/chatbot.png' %}" alt="Chatbot" style="height: 1.5em; vertical-align: middle; margin-right: 0.3em;">
      NodoBOT</h5>
    <a href="{% url 'vista_inicio' %}" class="{% if request.resolver_match.url_name == 'vista_inicio' %}active{% endif %}">
        <i class="bi bi-house-door-fill"></i> Inicio
    </a>
    <a href="{% url 'vista_consultas' %}" class="{% if request.resolver_match.url_name == 'vista_consultas' %}active{% endif %}">
        <i class="bi bi-file-earmark-text"></i> Consultas
    </a>
    <a href="{% url 'vista_temas' %}" class="{% if request.resolver_match.url_name == 'vista_temas' %}active{% endif %}">
        <i class="bi bi-puzzle"></i> Temas
    </a>
    <a href="#"><i class="bi bi-people"></i> Clientes</a>
    <a href="#"><i class="bi bi-building"></i> Historial</a>
    <a href="#"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</a>
</aside>

<main>
    <!-- BLOQUE DE CONTENIDO DINÁMICO -->
    <div class="mt-3">
        {% block content %}{% endblock %}
    </div>
</main>

<!-- Toast -->
<div class="position-fixed top-0 end-0 p-3" style="z-index: 1080;">
    <div class="toast-container">
        {% if messages %}
            {% for message in messages %}
                <div class="toast align-items-center text-bg-success border-0 show" role="alert">
                    <div class="d-flex">
                        <div class="toast-body">{{ message }}</div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                    </div>
                </div>
            {% endfor %}
        {% endif %}
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}

</body>
</html>
